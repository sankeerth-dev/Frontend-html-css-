<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>close window</h1>
    <button onclick="handler1()">Open Window</button>
    <button onclick="handler2()">Close Window</button>
    <script>
        var x = null;
        function handler1(){
            // open("https://www.google.com");    /*open in a new tab  */
            x=window.open("https://www.google.com","title", "width=400,height=400");  /*open in a new window  */
        }
        function handler2(){
            x.close();    // close method is only compatible with chrome
        }
    </script>
</body>
</html>
