<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>prompt window</h1>
    <p>used to accept input (string)</p>
    <button onclick="handler()">click me</button>
    <script>
        function handler(){
            var na = prompt("enter your name");
            var ag = prompt("enter your age");
            alert("your name is " + na + " and your age is " + ag);
     }
    </script>
</body>
</html>
