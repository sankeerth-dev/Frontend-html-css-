<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 300px;
            height: 200px;
            padding: 5px;
            border: 2px solid black;
        }

    </style>
</head>
<body>
    <h1>onmouseover and onmouseleave</h1>
    
    <div class="container" onmouseover="inHandler()" onmouseleave="outHandler()">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Suscipit qui sed ipsa animi consequatur, non quas? Accusamus magnam aperiam, quos culpa dicta veritatis, quibusdam praesentium sequi voluptas, debitis tempora itaque.</p>
    </div>
    <script>
        let blk = document.querySelector(".container");
        function inHandler(){
            blk.style.backgroundColor = "magenta";
        }
        function outHandler(){
            blk.style.backgroundColor = "gray";
        }
    </script>
</body>
</html>
