<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>javascript events</h1>
    <pre>
        Event is an action listeners.
            event can be called in 3 ways
        1. As an attribute
        2. As a dom property
        3.through addEventListener() method
    </pre>
    <button onclick="handler1()">Event attribute</button>
    <script>
        // as an attribute
        function handler1(){
            alert("button clicked..")
        }
    </script>
</body>
