<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Click Events</h1>
    <button onclick="clickHandler()">Single click</button>
    <button ondblclick="clickHandler()">Double click</button>
    <script>
        function clickHandler(){
            alert("button clicked..")
        }
    </script>
</body>
</html>
