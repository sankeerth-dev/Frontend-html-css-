<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>media events</h1>
    <p>audio and video</p>
    <pre>
        onplay,       
        onpause,
        onvolumechange,
        onseeking - time bar changed
        onseeked - time changed
    </pre>
    <hr>
    <h1 id="msg"></h1>
    <hr>
    <video src="https://www.learningcontainer.com/wp-content/uploads/2020/05/sample-mp4-file.mp4" type="video/mp4" controls onplay="playHan()" onpause="pauseHan()"
    onvolumechange="volHan()" onseeking="seekHan()" onseeked="seekedHan()"></video>
    <hr>
    <script>
        let msg = document.getElementById("msg");
        function playHan(){
            msg.innerText = "started playing video";
            msg.style.color = "green";
        }
        function pauseHan(){
            msg.innerText = "video paused";
            msg.style.color = "crimson";
        }
        function volHan(){
            msg.innerText = "changing volume";
            msg.style.color = "deepskyblue";
        }
        function seekHan(){
            msg.innerText = "video timing is changing";
            msg.style.color = "orange";
        }
        function seekedHan(){
            msg.innerText = "video timing changed";
            msg.style.color = "violet";
        }
    </script>
</body>
</html>
